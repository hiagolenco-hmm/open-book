<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, viewport-fit=cover">
<meta http-equiv="Content-Security-Policy" content="default-src 'self'; style-src 'self' 'unsafe-inline'; script-src 'self' 'wasm-unsafe-eval'; worker-src 'self' blob:; connect-src 'self' data: blob:; manifest-src 'self'; img-src 'self' data: blob: https://i.ytimg.com; media-src 'self' file: blob: data:; frame-src https: http:">
<title>Open Book</title>
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="icon-180.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Open Book">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="theme-color" content="#ffffff">
<link rel="stylesheet" href="style.css">
</head>
<body>
<div id="sbBackdrop"></div>
<div id="tabbar">
  <div id="appicon" title="Open Book v2.5.0"><svg width="18" height="18" viewBox="0 0 64 64"><rect x="10" y="4" width="46" height="56" rx="7" fill="#e9a23b"/><rect x="10" y="4" width="11" height="56" rx="5" fill="#c7811f"/><rect x="29" y="16" width="20" height="14" rx="2" fill="#fff" opacity=".95"/><path d="M29 38h20M29 45h14" stroke="#fff" stroke-width="3" stroke-linecap="round" opacity=".9"/></svg></div>
  <div id="tabs"></div>
  <div id="dragfill"></div>
  <div id="winctl"><button id="wMin" title="Minimizar"></button><button id="wMax" title="Maximizar"></button><button id="wClose" title="Fechar"></button></div>
</div>
<div id="app">
  <aside id="sidebar">
    <div class="sb-head">
      <div class="ws-icon"><svg width="22" height="22" viewBox="0 0 64 64"><rect x="10" y="4" width="46" height="56" rx="7" fill="#e9a23b"/><rect x="10" y="4" width="11" height="56" rx="5" fill="#c7811f"/><rect x="29" y="16" width="20" height="14" rx="2" fill="#fff" opacity=".95"/><path d="M29 38h20M29 45h14" stroke="#fff" stroke-width="3" stroke-linecap="round" opacity=".9"/></svg></div>
      <div class="ws-name">Open Book</div>
      <button class="icon-btn" id="btnCollapse" title="Recolher menu (Ctrl+\)"></button>
    </div>
    <div class="sb-nav">
      <div class="sb-item" id="btnSearch"><span class="ic">🔍</span><span>Buscar</span><span class="kbd">Ctrl+P</span></div>
      <div class="sb-item" id="btnNewTop"><span class="ic">＋</span><span>Nova página</span><span class="kbd">Ctrl+N</span></div>
      <div class="sb-item" id="btnToday" title="Abre a página de hoje (Ctrl+Alt+D)"><span class="ic">📅</span><span>Hoje</span></div>
      <div class="sb-item" id="btnTemplates"><span class="ic">📋</span><span>Modelos</span></div>
    </div>
    <div id="treeScroll">
      <div id="favSection" style="display:none">
        <div class="sb-section"><span>Favoritos</span></div>
        <div id="favTree"></div>
      </div>
      <div class="sb-section"><span>Páginas</span><button class="icon-btn sm" id="btnAddRoot" title="Nova página">＋</button></div>
      <div id="tree"></div>
    </div>
    <div class="sb-foot">
      <div class="sb-item" id="btnTrash"><span class="ic">🗑</span><span>Lixeira</span></div>
      <div class="sb-item" id="btnBackup"><span class="ic">💾</span><span>Backup</span></div>
      <div class="sb-item" id="btnTheme"><span class="ic">🎨</span><span>Temas</span></div>
    </div>
    <div id="resizer"></div>
  </aside>

  <main id="main">
    <div id="topbar">
      <button class="icon-btn" id="btnExpand" title="Abrir menu (Ctrl+\)" style="display:none"></button>
      <button class="icon-btn" id="btnBack" title="Voltar (Alt+←)"></button>
      <button class="icon-btn" id="btnFwd" title="Avançar (Alt+→)"></button>
      <div id="breadcrumb"></div>
      <div id="topRight">
        <span id="editedAt"></span>
        <button class="icon-btn" id="btnFav" title="Favoritar">☆</button>
        <button class="icon-btn" id="btnMore" title="Mais opções da página">⋯</button>
      </div>
    </div>
    <div id="scroll">
      <div id="coverWrap"></div>
      <div id="page">
        <div id="pageHead"></div>
        <div id="blocks"></div>
        <div id="backlinks" style="display:none"></div>
        <div id="addRow"><button id="btnAddSub" title="Cria uma página dentro desta">📄 Nova subpágina</button><button id="btnAddImg" title="Inserir imagem">🖼 Imagem</button></div>
        <div id="pad"></div>
      </div>
    </div>
  </main>
</div>

<div id="findbar"><input id="findInput" placeholder="Buscar na página" spellcheck="false" autocomplete="off"><span id="findCount"></span><button id="findPrev" title="Anterior (Shift+Enter)">&#9650;</button><button id="findNext" title="Próximo (Enter)">&#9660;</button><button id="findClose" title="Fechar (Esc)">&#10005;</button></div>
<div id="slash" class="popup" style="display:none"></div>
<div id="ctx" class="popup" style="display:none"></div>
<div id="emoji" class="popup" style="display:none"></div>
<div id="ftb" style="display:none"></div>
<div id="dropline" style="display:none"></div>
<div id="toast" style="display:none"></div>
<div id="mbar"></div>
<input type="file" id="mdInput" accept=".md,.markdown,.txt,text/plain,text/markdown" multiple style="display:none">
<input type="file" id="backupInput" accept=".json,application/json" style="display:none">
<input type="file" id="fileInput" accept="image/*" multiple style="display:none">

<div id="searchModal" class="overlay" style="display:none">
  <div class="modal-box">
    <input id="searchInput" placeholder="Buscar páginas e textos…" autocomplete="off">
    <div id="searchResults"></div>
  </div>
</div>

<div id="trashModal" class="overlay" style="display:none">
  <div class="modal-box">
    <div class="modal-title"><span>Lixeira</span><button class="link-btn" id="btnEmptyTrash">Esvaziar lixeira</button></div>
    <div id="trashList"></div>
  </div>
</div>

<script src="web.js"></script>
<script src="emoji-data.js"></script>
<script src="extras.js"></script>
<script src="app.js"></script>
<script src="spell.js"></script>
<script src="export.js"></script>
</body>
</html>
